<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 Admin Login — Bingo Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/game.css">
  <style>
    .center{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:22px}
    .login-panel{width:min(460px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px}
    .login-panel h1{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;margin:0 0 4px;font-size:2rem;color:var(--accent);}
    .input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);outline:none;font-family:'Outfit',sans-serif;font-size:.95rem;transition:border-color .2s;}
    .input:focus{border-color:var(--accent);}
    .label{display:block;margin:14px 0 6px;color:var(--muted);font-size:.8rem;letter-spacing:.5px;text-transform:uppercase;}
    .err{color:var(--danger);margin-top:12px;font-size:.85rem;display:none;padding:10px 14px;background:rgba(231,76,60,.1);border-radius:8px;border:1px solid rgba(231,76,60,.3);}
    .hint{color:var(--muted);font-size:.82rem;margin-top:6px;line-height:1.5;}
    .btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
    .login-btn{flex:1;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#041015;font-family:'Outfit',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;transition:filter .15s;}
    .login-btn:hover{filter:brightness(1.1);}
    .cancel-btn{flex:1;padding:12px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;}
  </style>
</head>
<body>
  <header>
    <div class="logo">🎱 Bingo Pro</div>
    <div class="nav-links">
      <a class="nav-link" href="/">🎮 Juego</a>
      <a class="nav-link" href="/cartillas">🎴 Mi Cartilla</a>
    </div>
  </header>

  <div class="center">
    <div class="login-panel">
      <h1>🔒 Acceso Admin</h1>
      <div class="hint">Solo el organizador del juego puede acceder.</div>

      <label class="label">Usuario</label>
      <input id="u" class="input" placeholder="Ingresa tu usuario" autocomplete="username">

      <label class="label">Contraseña</label>
      <input id="p" class="input" type="password" placeholder="••••••••" autocomplete="current-password">

      <!-- Después del campo de contraseña -->
    <div id="totp-group" style="display:none">
      <label class="label">Código de autenticador (6 dígitos)</label>
      <input id="totp" class="input" type="text" maxlength="6"
            placeholder="000000" autocomplete="one-time-code"
            inputmode="numeric" pattern="[0-9]{6}">
    </div>

    

      <div class="btn-row">
        <button class="login-btn" onclick="login()">Ingresar →</button>
        <a class="cancel-btn" href="/">Cancelar</a>
      </div>

      <div id="err" class="err">❌ Usuario o contraseña incorrectos. Inténtalo de nuevo.</div>
    </div>
  </div>

  <script>
    // En la función login(), modificar:
    async function login() {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      const totp     = document.getElementById('totp')?.value?.trim() || '';

      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, totp }),
      });
      const data = await res.json();

      if (data.requires_totp) {
    // Show TOTP field
        document.getElementById('totp-group').style.display = 'block';
        document.getElementById('totp').focus();
        document.getElementById('err').textContent = '🔐 Ingresa el código de tu autenticador.';
        document.getElementById('err').style.display = 'block';
        return;
      }
      if (!res.ok) {
        document.getElementById('err').textContent = data.message || '❌ Error de acceso.';
        document.getElementById('err').style.display = 'block';
        return;
      }
      location.href = '/admin/game';
    }
  </script>
</body>
</html>
